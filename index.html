<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ange Pizza Lab"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=3010"><title>Ange Pizza Lab</title></head><body>
<header class="app-header" id="pageTop">
  <div class="header-inner">
    <div class="brand"><img src="icon-180.png" alt="" class="brand-icon"><h1>Ange Pizza Lab</h1></div>
    <details class="settings-menu" id="settingsMenu">
      <summary aria-label="設定" title="設定"><span class="ui-icon ui-icon-gear" aria-hidden="true"></span></summary>
      <div class="settings-actions">
        <button id="openTempSettings" type="button" class="quiet">温度設定</button>
        <button id="reset" type="button" class="quiet">配合を初期化</button>
      </div>
    </details>
  </div>
</header>
<main>
<nav class="tabs" aria-label="画面の切り替え">
  <button type="button" data-tab="recipe" class="active" aria-pressed="true"><span class="ui-icon ui-icon-scale" aria-hidden="true"></span><span>配合</span></button>
  <button type="button" data-tab="saved" aria-pressed="false"><span class="ui-icon ui-icon-book" aria-hidden="true"></span><span>レシピ帳</span></button>
  <button type="button" data-tab="ferment" aria-pressed="false"><span class="ui-icon ui-icon-note" aria-hidden="true"></span><span>ピザノート</span></button>
</nav>
<section id="recipe" class="panel active" aria-label="配合">
  <section class="card formula-basics">
    <h2>基本の配合</h2>
    <select id="style" hidden aria-hidden="true"></select>
    <p class="note" id="styleSource" hidden></p>
    <button id="adopt" hidden type="button"></button><button id="restorePreset" hidden type="button"></button>
    <p class="note" id="adoptStatus" hidden></p>
    <div class="method-switch" role="group" aria-label="製法">
      <button type="button" data-process="straight">ストレート</button>
      <button type="button" data-process="biga">ビガ</button>
      <button type="button" data-process="poolish">ポーリッシュ</button>
    </div>
    <select id="process" aria-label="製法" hidden>
      <option value="biga">ビガ法</option><option value="straight">ストレート法</option><option value="poolish">ポーリッシュ法</option>
    </select>
    <div class="seg" role="group" aria-label="計算方法">
      <button type="button" data-mode="flour">粉量から</button>
      <button type="button" data-mode="target">玉数から</button>
    </div>
    <div id="baseControls"></div>
  </section>
  <details class="card formula-section">
    <summary><span class="ui-icon ui-icon-flour" aria-hidden="true"></span><span>粉のブレンド</span><span class="section-metric" id="flourMetric"></span></summary>
    <div class="formula-section-content">
      <div id="flourRows"></div>
      <button id="addFlour" type="button" class="quiet add-flour"><span class="ui-icon ui-icon-plus" aria-hidden="true"></span><span>粉を追加</span></button>
      <div id="prefermentBox"><h3 id="prefermentTitle">ビガ</h3><div id="prefermentControls"></div></div>
    </div>
  </details>
  <details class="card formula-section">
    <summary><span class="ui-icon ui-icon-drop" aria-hidden="true"></span><span>加水・塩・イースト</span><span id="hydrationMetric" class="section-metric"></span></summary>
    <div class="formula-section-content">
      <div id="ratioControls"></div>
      <div class="field">
        <label for="yeastType">イーストの種類</label>
        <select id="yeastType"><option value="dry">ドライイースト</option><option value="fresh">生イースト</option></select>
      </div>
      <div id="yeastControl"></div><p class="note" id="yeastPercent"></p>
      <div id="yeastSplitField"><div id="prefermentYeastControl"></div></div>
      <details class="extra-materials">
        <summary>その他の材料</summary>
        <div class="extra-grid">
          <input id="extraName0" aria-label="材料1の名前" placeholder="例：砂糖"><div id="extraPct0Control"></div>
          <input id="extraName1" aria-label="材料2の名前" placeholder="例：はちみつ"><div id="extraPct1Control"></div>
        </div>
      </details>
    </div>
  </details>
</section>
<section id="ferment" class="panel"><div class="note-view-switch" role="group" aria-label="ピザノート表示切替"><button type="button" id="noteHistoryTab" class="active" aria-pressed="true"><span class="ui-icon ui-icon-note" aria-hidden="true"></span><span>履歴</span></button><button type="button" id="noteNewTab" aria-label="新規仕込み記録を追加" title="新規記録" aria-pressed="false"><span class="ui-icon ui-icon-plus" aria-hidden="true"></span><span>記録する</span></button></div><div class="card note-editor-card" hidden><h2>仕込み記録</h2>
<div class="field"><label for="noteRecipe">レシピ</label><select id="noteRecipe"><option value="current">現在の配合</option></select></div>
<div class="note-datetime-row"><div class="field"><label for="noteStarted">仕込み日時</label><input id="noteStarted" type="datetime-local"></div></div><div class="two-col"><div class="field"><label for="noteTemp">室温（℃）</label><input id="noteTemp" type="number" min="-10" max="50" step="0.1" placeholder="25"></div>
<div class="field"><label for="noteHumidity">湿度（%）</label><input id="noteHumidity" type="number" min="0" max="100" step="1" placeholder="60"></div><div class="field"><label for="noteMethod">熟成方法</label><select id="noteMethod"><option value="room">常温</option><option value="cold">冷蔵</option><option value="mixed">常温＋冷蔵</option></select></div></div>
<div id="noteSeedBlock" class="note-stage"><h3><span class="ui-icon ui-icon-flour" aria-hidden="true"></span>発酵種</h3><div class="duration-picks" data-target="noteSeedHours"><button type="button" data-hours="8">8時間</button><button type="button" data-hours="16">16時間</button><button type="button" data-hours="24">24時間</button><button type="button" data-hours="custom">手入力</button></div><div class="field duration-custom" id="noteSeedCustom" hidden><label for="noteSeedHours">発酵種の時間（時間）</label><input id="noteSeedHours" type="number" min="0" max="500" step="0.5" inputmode="decimal" placeholder="例：12"></div><p id="noteSeedDuration" class="duration-label">未設定</p></div>
<div class="note-stage"><h3><span class="ui-icon ui-icon-clock" aria-hidden="true"></span>本練り後</h3><div class="duration-picks" data-target="noteMatureHours"><button type="button" data-hours="24">1日</button><button type="button" data-hours="48">2日</button><button type="button" data-hours="72">3日</button><button type="button" data-hours="custom">手入力</button></div><div class="field duration-custom" id="noteMatureCustom" hidden><label for="noteMatureHours">熟成時間（時間）</label><input id="noteMatureHours" type="number" min="0" max="1000" step="0.5" inputmode="decimal" placeholder="例：36"></div><p id="noteMatureDuration" class="duration-label">未設定</p></div>
<div class="field"><label for="noteRating">出来栄え</label><select id="noteRating"><option value="">未評価</option><option value="1">★☆☆☆☆（1）</option><option value="2">★★☆☆☆（2）</option><option value="3">★★★☆☆（3）</option><option value="4">★★★★☆（4）</option><option value="5">★★★★★（5）</option></select></div><div class="field"><label for="noteMemo">メモ</label><textarea id="noteMemo" rows="4"></textarea></div>
<button id="saveNote" class="primary">仕込み記録を保存</button><p id="noteStatus" class="note" role="status"></p></div><div class="card note-history-card" aria-label="仕込み履歴"><div class="list-tools"><input id="noteSearch" type="search" placeholder="日付・レシピ・メモで検索" aria-label="仕込み履歴を検索"><select id="noteRatingFilter" aria-label="評価で絞り込む"><option value="">全評価</option><option value="5">★★★★★</option><option value="4">★★★★以上</option><option value="3">★★★以上</option><option value="2">★★以上</option><option value="1">★以上</option><option value="unrated">未評価</option></select></div><div id="noteList"></div><button id="moreNotes" class="quiet list-more" hidden>さらに5件表示</button></div></section>
<section id="bake" class="panel"><div class="card"><h2>焼成ガイド</h2><div id="bakeGuide" class="hero"></div><p class="note">高温窯での参考値です。お使いの窯が最高400℃の場合、ナポリ風は90秒〜2分半ほどから試し、焼床・底面・焼き色を見て調整してください。窯の表示温度と焼床温度は異なることがあります。</p></div></section>
<section id="saved" class="panel" aria-label="レシピ帳"><div class="card"><div id="recipeEditor" hidden>
  <button id="recipeEditFormula" type="button" class="quiet icon-action"><span class="ui-icon ui-icon-scale" aria-hidden="true"></span>配合を調整</button>
  <div class="field"><label for="recipeName">保存するレシピ名</label><input id="recipeName" placeholder="レシピ名"></div>
  <details class="recipe-conditions" id="editRecipeOptions"><summary><span class="ui-icon ui-icon-drop" aria-hidden="true"></span>発酵条件・メモ</summary><div id="editRecipeConditions"></div></details>
  <div class="actions">
    <button id="overwriteRecipe" class="primary" type="button">上書き保存</button>
    <button id="saveRecipe" class="quiet" type="button">別名で保存</button>
    <button id="cancelRecipeEdit" class="quiet" type="button">編集をやめる</button>
  </div>
</div><div id="recipeEditStatus" class="note" role="status"></div><div class="list-tools"><input id="recipeSearch" type="search" placeholder="レシピを検索" aria-label="レシピを検索"><select id="recipeSort" aria-label="レシピの並び順"><option value="new">新しい順</option><option value="name">名前順</option></select></div><div id="recipeList"></div><button id="moreRecipes" class="quiet list-more" hidden>さらに5件表示</button><details class="backup-settings"><summary><span class="ui-icon ui-icon-save" aria-hidden="true"></span>バックアップ・復元</summary><button id="exportBackup" class="quiet">バックアップを書き出す</button><label class="restore-label">バックアップから復元<input id="importBackup" type="file" accept="application/json,.json"></label><p id="backupStatus" class="note" role="status"></p></details></div></section>
</main>
<template id="recipeConditionsFields">
  <div class="two-col">
    <label class="field">室温（℃）<input data-condition="room" type="number" min="-10" max="50" step="0.1"></label>
    <label class="field">冷蔵庫（℃）<input data-condition="fridge" type="number" min="-5" max="20" step="0.1"></label>
  </div>
  <label class="field">発酵方法
    <select data-condition="method">
      <option value="">未記入</option>
      <option value="room">常温</option>
      <option value="cold">冷蔵</option>
      <option value="mixed">常温＋冷蔵庫</option>
    </select>
  </label>
  <div class="two-col">
    <label class="field">常温発酵（時間）<input data-condition="roomHours" type="number" min="0" max="500" step="0.5"></label>
    <label class="field">冷蔵発酵（時間）<input data-condition="coldHours" type="number" min="0" max="500" step="0.5"></label>
  </div>
  <label class="field">メモ<textarea data-condition="memo" rows="2"></textarea></label>
</template>
<dialog id="tempSettingsModal" class="recipe-modal"><form method="dialog"><h2>温度の初期設定</h2><p class="note">レシピ追加と発酵の参考表示に利用します。</p><div class="field"><label for="defaultRoom">標準室温（℃）</label><input id="defaultRoom" type="number" min="-10" max="50" step="0.1"></div><div class="field"><label for="defaultFridge">冷蔵庫内温度（℃）</label><input id="defaultFridge" type="number" min="-5" max="20" step="0.1"></div><p id="tempError" class="warning" hidden></p><div class="actions"><button id="tempCancel" type="button" class="quiet">キャンセル</button><button id="tempSave" type="button" class="primary">設定を保存</button></div></form></dialog><dialog id="recipeModal" class="recipe-modal"><form method="dialog" id="recipeModalForm" novalidate><h2>レシピを保存</h2><div class="field"><label for="modalRecipeName">レシピ名</label><input id="modalRecipeName" placeholder="例：いつものビガ生地" required></div><div id="newRecipeConditions"></div><p id="modalError" class="warning" role="status" hidden></p><div class="actions"><button id="modalCancel" type="button" class="quiet">キャンセル</button><button id="modalSkip" type="button" class="quiet">条件をスキップして保存</button><button id="modalSave" type="submit" class="primary">保存する</button></div></form></dialog><aside id="stickySummary" class="sticky-summary" aria-label="配合結果">
<div class="summary-bar">
  <div class="summary-total"><span>総生地量</span><strong id="summaryWeight">—</strong></div>
  <button type="button" id="summaryToggle" class="dock-action quiet" aria-expanded="false" aria-controls="summaryDetails"><span class="ui-icon ui-icon-table" aria-hidden="true"></span><span>材料</span></button>
  <button type="button" id="quickSaveRecipe" class="dock-action primary"><span class="ui-icon ui-icon-save" aria-hidden="true"></span><span id="quickSaveLabel">保存</span></button>
</div>
<p id="summaryIngredients" class="summary-message" role="status" hidden></p>
<div id="summaryDetails" hidden><table class="summary-table" aria-label="材料内訳（g）">
<thead><tr><th scope="col">材料（g）</th><th id="summarySeedHeading" scope="col">発酵種</th><th scope="col">本練り</th><th scope="col">合計</th></tr></thead>
<tbody id="summaryMaterialRows"></tbody></table><div class="summary-balls" id="summaryBalls"></div><div class="summary-detail-title">発酵の参考時間</div><div class="method-switch" role="group" aria-label="発酵方法"><button type="button" class="ferment-choice" data-ferment="room">常温</button><button type="button" class="ferment-choice" data-ferment="mixed">常温＋冷蔵庫</button></div><div id="fermentReference" class="note" aria-live="polite"></div></div></aside><footer class="app-footer"><a href="#pageTop">先頭へ</a></footer><script defer src="app.js?v=3010"></script></body></html>
